spring:
  application:
    name: vera
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: vera
    create-schemas: true
  jooq:
    sql-dialect: POSTGRES
  modulith:
    runtime:
      verification-enabled: true   # abort startup if a module boundary is violated
  docker:
    compose:
      enabled: false               # turned on by the dev profile only

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
